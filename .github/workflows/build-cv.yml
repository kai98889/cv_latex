name: Build LaTeX CV
'on':
  push:
    branches:
    - main
    - master
    paths:
    - '**.tex'
    - img/**
    - .github/workflows/build-cv.yml
  pull_request:
    branches:
    - main
    - master
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v5
    - name: Compile CV with XeLaTeX
      uses: xu-cheng/latex-action@v4
      with:
        root_file: main.tex
        latexmk_use_xelatex: true
    - name: Save PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: cv-pdf
        path: main.pdf
        if-no-files-found: error
  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository for publication
      uses: actions/checkout@v5
      with:
        fetch-depth: '0'
        path: publication
    - name: Download compiled CV
      uses: actions/download-artifact@v4
      with:
        name: cv-pdf
        path: pdf
    - name: Update release branch
      id: release_commit
      working-directory: publication
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        if git show-ref --verify --quiet refs/remotes/origin/release; then
          git switch --track origin/release
        else
          git switch --orphan release
        fi
        cp ../pdf/main.pdf main.pdf
        git add -f main.pdf
        git commit --allow-empty -m "Build CV from ${SOURCE_SHA}"
        git push origin HEAD:release
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Publish PDF release
      working-directory: publication
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        RUN_NUMBER: ${{ github.run_number }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        tag="v${RUN_NUMBER}.${RUN_ATTEMPT}"
        gh release create "$tag" \
          --target "$RELEASE_SHA" \
          --title "CV $tag" \
          --notes "Automatically compiled CV from source commit ${SOURCE_SHA}." \
          ../pdf/main.pdf
